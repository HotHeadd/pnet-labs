version: '3.8'
services:
  db:
    image: postgres:17-alpine
    container_name: sa6-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: sa6-keycloak
    restart: unless-stopped
    command: [start, --hostname=https://auth.sa6.test, --http-enabled=true, --proxy-headers=xforwarded]
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: labadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores/sa6-ca.crt
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./tls/ca.crt:/opt/keycloak/conf/truststores/sa6-ca.crt:ro
    extra_hosts:
      - directory.sa6.test:10.60.0.10
      - auth.sa6.test:10.60.0.30
  gitea:
    image: docker.gitea.com/gitea:28.4.0
    container_name: sa6-gitea
    restart: unless-stopped
    environment:
      USER_UID: '1000'
      USER_GID: '1000'
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: git.sa6.test
      GITEA__server__ROOT_URL: https://git.sa6.test/
      GITEA__server__DISABLE_SSH: 'true'
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'false'
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: 'true'
      GITEA__service__REGISTER_EMAIL_CONFIRM: 'false'
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: 'true'
      GITEA__oauth2_client__USERNAME: nickname
      GITEA__oauth2_client__ACCOUNT_LINKING: login
      SSL_CERT_FILE: /etc/ssl/certs/sa6-bundle.pem
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./gitea:/data
      - ./tls/ca-bundle.crt:/etc/ssl/certs/sa6-bundle.pem:ro
    extra_hosts:
      - auth.sa6.test:10.60.0.30
  vaultwarden:
    image: vaultwarden/server:1.37.5
    container_name: sa6-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.sa6.test
      SIGNUPS_ALLOWED: 'true'
      INVITATIONS_ALLOWED: 'true'
      SSO_ENABLED: 'true'
      SSO_ONLY: 'true'
      SSO_AUTHORITY: https://auth.sa6.test/realms/sa6
      SSO_CLIENT_ID: vaultwarden
      SSO_CLIENT_SECRET: ${VAULT_OIDC_SECRET}
      SSO_SCOPES: openid profile email offline_access
      SSO_SIGNUPS_MATCH_EMAIL: 'false'
      SSL_CERT_FILE: /etc/ssl/certs/sa6-bundle.pem
    ports:
      - 127.0.0.1:8081:80
    volumes:
      - ./vaultwarden:/data
      - ./tls/ca-bundle.crt:/etc/ssl/certs/sa6-bundle.pem:ro
    extra_hosts:
      - auth.sa6.test:10.60.0.30
