map $http_upgrade $sa6_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name auth.sa6.test git.sa6.test vault.sa6.test;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name auth.sa6.test;
    ssl_certificate /opt/sa6/tls/web.crt;
    ssl_certificate_key /opt/sa6/tls/web.key;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    server_name git.sa6.test;
    ssl_certificate /opt/sa6/tls/web.crt;
    ssl_certificate_key /opt/sa6/tls/web.key;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sa6_connection_upgrade;
    }
}
server {
    listen 443 ssl;
    server_name vault.sa6.test;
    ssl_certificate /opt/sa6/tls/web.crt;
    ssl_certificate_key /opt/sa6/tls/web.key;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sa6_connection_upgrade;
    }
}
