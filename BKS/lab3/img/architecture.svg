<text x="935" y="259" text-anchor="middle" font-family="Arial" font-size="16" fill="#94662f">Только веб-сервис</text>
<rect x="80" y="80" width="350" height="130" rx="10" fill="#eff5fa" stroke="#526b85" stroke-width="2"/>
<text x="255.0" y="108" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18344f">ЦОД-1 / ГО</text>
<text x="255.0" y="134" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Нижний Новгород · 10.1.0.0/16</text>
<text x="255.0" y="157" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Шлюзы SD-WAN / МЭ / DMZ</text>
<text x="255.0" y="180" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Основные сервисы и контроллер</text>
<rect x="670" y="80" width="350" height="130" rx="10" fill="#eff5fa" stroke="#526b85" stroke-width="2"/>
<text x="845.0" y="108" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18344f">ЦОД-2</text>
<text x="845.0" y="134" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Другая площадка · 10.3.0.0/16</text>
<text x="845.0" y="157" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Резервные шлюзы и сервисы</text>
<text x="845.0" y="180" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Независимый канал и питание</text>
<rect x="30" y="385" width="310" height="140" rx="10" fill="#eff5fa" stroke="#526b85" stroke-width="2"/>
<text x="185.0" y="413" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18344f">20 пунктов выдачи</text>
<text x="185.0" y="439" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Оптика и/или LTE</text>
<text x="185.0" y="462" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">CPE с Zero-Touch Provisioning</text>
<text x="185.0" y="485" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Зашифрованный SD-WAN overlay</text>
<rect x="395" y="385" width="310" height="140" rx="10" fill="#eff5fa" stroke="#526b85" stroke-width="2"/>
<text x="550.0" y="413" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18344f">Лаборатория</text>
<text x="550.0" y="439" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Соседнее здание</text>
<text x="550.0" y="462" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Направленный радиомост</text>
<text x="550.0" y="485" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Защита канала и сегментация</text>
<rect x="760" y="385" width="310" height="140" rx="10" fill="#eff5fa" stroke="#526b85" stroke-width="2"/>
<text x="915.0" y="413" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18344f">Подрядчик</text>
<text x="915.0" y="439" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">HTTPS с аутентификацией</text>
<text x="915.0" y="462" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Прокси в DMZ → один сервис</text>
<text x="915.0" y="485" text-anchor="middle" font-family="Arial" font-size="16" fill="#18344f">Остальные сети закрыты</text>
<text x="35" y="605" font-family="Arial" font-size="16" fill="#40576a">Архитектурный проект: SD-WAN и физический радиоканал описаны и обоснованы теоретически.</text>
<text x="35" y="629" font-family="Arial" font-size="16" fill="#40576a">Практическая часть: отдельный Linux Site-to-Site стенд и каскад Xray (см. схему стенда).</text>
<text x="35" y="653" font-family="Arial" font-size="16" fill="#40576a">Резервирование сервисов требует репликации данных и проверки переключения приложений.</text>
