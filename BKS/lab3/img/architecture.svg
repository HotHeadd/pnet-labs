<text x="625" y="316" text-anchor="middle" font-family="Arial" font-size="16" fill="#247b63">Резервный overlay</text>
<polyline points="550,385 550,260 330,260 330,210" fill="none" stroke="#526b85" stroke-width="3" marker-end="url(#a)"/>
<text x="460" y="249" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b85">Радиоканал</text>
