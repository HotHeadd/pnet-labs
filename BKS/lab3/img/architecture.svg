<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526b85"/></marker></defs>
<rect width="1100" height="670" fill="white"/>
<text x="550" y="35" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#18344f">Вариант 6: проект распределённой корпоративной сети</text>
<polyline points="430,145 670,145" fill="none" stroke="#526b85" stroke-width="3" marker-end="url(#a)"/>
<text x="550" y="130" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b85">Защищённая межЦОД-связь</text>
