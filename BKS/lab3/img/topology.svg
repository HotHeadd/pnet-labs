<text x="740" y="267" text-anchor="middle" font-family="Arial" font-size="16" fill="black">TLS</text>
<polyline points="180,435 180,345" fill="none" stroke="black" stroke-width="3" marker-end="url(#a)"/>
<text x="245" y="395" text-anchor="middle" font-family="Arial" font-size="16" fill="black">BR-LAN</text>
<polyline points="560,345 560,435" fill="none" stroke="black" stroke-width="3" marker-end="url(#a)"/>
<text x="625" y="395" text-anchor="middle" font-family="Arial" font-size="16" fill="black">HQ-LAN</text>
