<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black"/></marker></defs>
<rect width="1100" height="670" fill="white"/>
<text x="550" y="35" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="black">Стенд БКС3: защищённая связь ГО и филиала</text>
<polyline points="180,220 180,100 560,100 560,220" fill="none" stroke="black" stroke-width="3" marker-end="url(#a)"/>
<text x="370" y="88" text-anchor="middle" font-family="Arial" font-size="16" fill="black">GRE / IPsec / OSPF</text>
