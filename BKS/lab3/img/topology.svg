<text x="730" y="585" text-anchor="middle" font-family="Arial" font-size="16" fill="black">Xray: клиент → relay → HQ → сервер</text>
<rect x="45" y="220" width="270" height="125" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="180.0" y="248" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="black">BR-GW</text>
<text x="180.0" y="274" text-anchor="middle" font-family="Arial" font-size="16" fill="black">WAN 203.0.113.20/24</text>
<text x="180.0" y="297" text-anchor="middle" font-family="Arial" font-size="16" fill="black">LAN 10.2.20.1/24</text>
<text x="180.0" y="320" text-anchor="middle" font-family="Arial" font-size="16" fill="black">tun0 172.16.0.2/30</text>
