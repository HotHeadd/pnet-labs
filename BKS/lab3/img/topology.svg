<text x="560.0" y="248" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="black">HQ-GW</text>
<text x="560.0" y="274" text-anchor="middle" font-family="Arial" font-size="16" fill="black">WAN 203.0.113.10/24</text>
<text x="560.0" y="297" text-anchor="middle" font-family="Arial" font-size="16" fill="black">LAN 10.1.50.1/26</text>
<text x="560.0" y="320" text-anchor="middle" font-family="Arial" font-size="16" fill="black">tun0 172.16.0.1/30</text>
<rect x="785" y="220" width="270" height="125" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="920.0" y="248" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="black">XRAY-RELAY</text>
<text x="920.0" y="274" text-anchor="middle" font-family="Arial" font-size="16" fill="black">WAN 203.0.113.30/24</text>
<text x="920.0" y="297" text-anchor="middle" font-family="Arial" font-size="16" fill="black">VLESS + TLS 1.3</text>
<text x="920.0" y="320" text-anchor="middle" font-family="Arial" font-size="16" fill="black">Промежуточный узел</text>
<rect x="45" y="435" width="270" height="110" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="180.0" y="463" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="black">BR-CLIENT</text>
<text x="180.0" y="489" text-anchor="middle" font-family="Arial" font-size="16" fill="black">10.2.20.42/24</text>
<text x="180.0" y="512" text-anchor="middle" font-family="Arial" font-size="16" fill="black">SOCKS5 127.0.0.1:1080</text>
<rect x="425" y="435" width="270" height="110" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="560.0" y="463" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="black">HQ-SRV</text>
