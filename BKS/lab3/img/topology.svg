<text x="560.0" y="512" text-anchor="middle" font-family="Arial" font-size="16" fill="black">HTTP TCP/8080</text>
<text x="35" y="605" font-family="Arial" font-size="16" fill="black">WAN — изолированный Ethernet-сегмент эмулятора, сеть 203.0.113.0/24.</text>
<text x="35" y="629" font-family="Arial" font-size="16" fill="black">Служебное pnet0 (192.168.15.211–215) подключено отдельно и не участвует в передаче между LAN.</text>
<text x="35" y="653" font-family="Arial" font-size="16" fill="black">Серверная сеть ГО и LAN филиала сохранены из адресного плана БКС1.</text>
